# Вигляд додатку (тема, шрифт). Секрети тут НЕ зберігати — для них .streamlit/secrets.toml (у .gitignore).
# Тема — як у системі людини (світла чи темна): тому задаємо кольори окремо для обох, а не "base".

[server]
# Найбільший файл, який можна завантажити через сайт, МБ (за замовчуванням 200). Річний CSV FIRMS по
# Україні — кілька МБ. 200 МБ у пам'яті розпухають у рази, а контейнер на VPS обмежений 1 ГБ:
# один такий файл зупинив би сайт для всіх.
maxUploadSize = 30

[client]
# Ховає кнопку "Deploy" і пункти меню розробника — для журі це шум. "viewer", а не "minimal":
# у "minimal" зникає все меню ⋮ разом із перемикачем світлої/темної теми.
toolbarMode = "viewer"

[theme]
# Шрифт Inter (є кирилиця) з Google Fonts; без інтернету Streamlit візьме звичайний без засічок
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"

[theme.light]
primaryColor = "#ea580c"              # помаранчевий "вогонь" — кнопки, слайдери, активна вкладка
# Не чисто білий: на #ffffff сторінка «сліпила», а кольорові панелі здавались блідими (баг-звіт #21)
# Навіть #fffaf5 «виїдав» очі (власник), тож тло — помітно темніший бежевий, як папір, а не біле
backgroundColor = "#f3ece2"           # бежевий фон сторінки
secondaryBackgroundColor = "#e9dccb"  # темніший бежевий фон бічної панелі й полів
textColor = "#1c1917"

[theme.dark]
primaryColor = "#f97316"
backgroundColor = "#111113"
secondaryBackgroundColor = "#1d1b1a"
textColor = "#f5f5f4"
